<header class="header">
  <a class="brand" href="/" aria-label="Sentinel dashboard"><span class="brand-icon">S</span><span>SENTINEL<small>LOCAL SURVEILLANCE NETWORK</small></span></a>
  <nav class="nav" aria-label="Main navigation">
    {% for href, label in [('/', 'Overview'), ('/recordings', 'Review'), ('/cameras/setup', 'Cameras'), ('/settings', 'Settings'), ('/diagnostics', 'Diagnostics')] %}
    <a href="{{ href }}" class="nav-link{% if request.path == href %} active{% endif %}" {% if request.path == href %}aria-current="page"{% endif %}>{{ label }}</a>

  </nav>
</header>
