name: Build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/build_desktop.py
      - name: Check frozen application resources
        run: python scripts/check_desktop.py
      - if: runner.os == 'Windows'
        run: python scripts/build_windows_setup.py
      - if: runner.os == 'Linux'
        run: tar -czf dist/Sentinel-Linux.tar.gz -C dist Sentinel
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-${{ runner.os }}
          path: |
            dist/Sentinel-Setup-Windows.exe
            dist/Sentinel-Linux.tar.gz
          retention-days: 14
