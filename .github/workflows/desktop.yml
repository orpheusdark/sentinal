name: Build desktop apps
on:
  workflow_dispatch:
    inputs:
      require_windows_signing:
        description: Fail the Windows build unless signing credentials are configured
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/build_desktop.py
      - name: Check frozen application resources
        run: python scripts/check_desktop.py
      - name: Sign Windows application when configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
          REQUIRE_SIGNING: ${{ inputs.require_windows_signing }}
        run: ./scripts/sign_windows.ps1 -TargetFile dist/Sentinel/Sentinel.exe -RequireSigning:($env:REQUIRE_SIGNING -eq 'true')
      - if: runner.os == 'Windows'
        name: Package portable Windows application
        run: python -c "import shutil; shutil.make_archive('dist/Sentinel-Windows-portable','zip','dist','Sentinel')"
      - if: runner.os == 'Windows'
        run: python scripts/build_windows_setup.py
      - name: Sign Windows installer when configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
          REQUIRE_SIGNING: ${{ inputs.require_windows_signing }}
        run: ./scripts/sign_windows.ps1 -TargetFile dist/Sentinel-Setup-Windows.exe -RequireSigning:($env:REQUIRE_SIGNING -eq 'true')
      - if: runner.os == 'Linux'
        run: tar -czf dist/Sentinel-Linux.tar.gz -C dist Sentinel
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-${{ runner.os }}
          path: |
            dist/Sentinel-Setup-Windows.exe
            dist/Sentinel-Windows-portable.zip
            dist/Sentinel-Linux.tar.gz
          retention-days: 14
