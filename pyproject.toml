[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinal-surveillance"
version = "0.3.0rc1"
description = "Local camera surveillance and monitoring dashboard"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/orpheusdark/sentinal"
Documentation = "https://github.com/orpheusdark/sentinal/blob/main/docs/README.md"
Issues = "https://github.com/orpheusdark/sentinal/issues"
Releases = "https://github.com/orpheusdark/sentinal/releases"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["app", "monitor", "watchdog", "desktop", "sentinel_version"]

[tool.setuptools.packages.find]
include = ["alerts*", "camera*", "config*", "database*", "motion*", "recording*", "storage*", "utils*", "web*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
config = ["settings.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
